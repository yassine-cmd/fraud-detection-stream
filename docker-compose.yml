name: fraud-detection

services:
  # ---------- Kafka (mode KRaft, sans Zookeeper) ----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    mem_limit: 512m
    ports:
      - "29092:29092"   # acces machine hote
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # Creation unique du topic Kafka transactions_stream
  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic transactions_stream
        --partitions 3 --replication-factor 1
    restart: "no"

  # ---------- MongoDB (noeud unique standalone) ----------
  # Un seul noeud suffit pour ce projet. Un replica set 1 noeud ne serait
  # necessaire que pour des transactions multi-documents / change streams.
  mongo:
    image: mongo:7
    container_name: mongo
    mem_limit: 512m
    ports:
      - "27017:27017"
    environment:
      MONGO_TTL_SECONDS: "${MONGO_TTL_SECONDS:-86400}"
    volumes:
      - mongo_data:/data/db
      - ./streaming/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Reapplique les index et la TTL a chaque demarrage (idempotent).
  # Permet de changer MONGO_TTL_SECONDS sans recreer le volume mongo_data.
  mongo-config:
    image: mongo:7
    container_name: mongo-config
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_TTL_SECONDS: "${MONGO_TTL_SECONDS:-86400}"
    volumes:
      - ./streaming/mongo-init.js:/scripts/mongo-init.js:ro
    entrypoint: ["mongosh", "--quiet"]
    command: ["mongodb://mongo:27017/fraud", "/scripts/mongo-init.js"]
    mem_limit: 256m
    restart: "no"

  # ---------- Spark (Master + Worker) ----------
  # Master gere le cluster Spark
  spark-master:
    build: ./streaming/spark_job
    image: fraud-spark:latest
    container_name: spark-master
    hostname: spark-master
    mem_limit: 1g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_DAEMON_MEMORY: 512m
    ports:
      - "8080:8080"   # UI Web du Master Spark
    restart: unless-stopped

  # Worker execute les calculs et heberge les bibliotheques ML
  spark-worker:
    image: fraud-spark:latest
    container_name: spark-worker
    depends_on:
      - spark-master
    mem_limit: 2g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_DAEMON_MEMORY: 512m
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 1024m
    volumes:
      - ./ml/artifacts:/models:ro
    restart: unless-stopped

  # Job Structured Streaming (Driver de scoring en flux)
  spark-job:
    image: fraud-spark:latest
    container_name: spark-job
    hostname: spark-job
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      # Pour tester Kafka+Spark sans MongoDB : passer MONGO_ENABLED a "false"
      # et supprimer les blocs mongo et mongo-config de depends_on.
      mongo:
        condition: service_healthy
      mongo-config:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
    mem_limit: 1536m
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: transactions_stream
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: fraud
      MONGO_ENABLED: "true"          # passer a "false" pour tester Kafka+Spark sans MongoDB
      MODEL_PATH: /models/model.joblib
      CHECKPOINT_DIR: /checkpoint
      TRIGGER_SECONDS: "1"
      MAX_OFFSETS_PER_TRIGGER: "2000"
      PYTHONUNBUFFERED: "1"
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      - --conf
      - spark.jars.ivy=/tmp/.ivy
      - --conf
      - spark.driver.host=spark-job
      - --conf
      - spark.driver.memory=512m
      - --conf
      - spark.driver.maxResultSize=256m
      - --conf
      - spark.executor.memory=512m
      - --conf
      - spark.executor.memoryOverhead=128m
      - --conf
      - spark.sql.shuffle.partitions=4
      - /app/streaming_job.py
    ports:
      - "4040:4040"   # UI du job streaming
    volumes:
      - ./streaming/spark_job/streaming_job.py:/app/streaming_job.py:ro
      - ./ml/artifacts:/models:ro
      - spark_checkpoint:/checkpoint
      - spark_ivy:/tmp/.ivy
    restart: unless-stopped

  # ---------- Simulateur de trafic PaySim -> Kafka ----------
  producer:
    build: ./streaming/producer
    container_name: producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    mem_limit: 256m
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: transactions_stream
      DATA_FILE: /data/test_stream.csv
      CONTROL_PORT: 8001
      RATE: "500"
      FRAUD_RATIO: "0.02"
      AUTO_START: "true"
    volumes:
      - ./streaming/data_sample:/data:ro
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ---------- API REST FastAPI ----------
  api:
    build: ./api
    container_name: fraud-api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mongo-config:
        condition: service_completed_successfully
      producer:
        condition: service_healthy
    mem_limit: 384m
    environment:
      MOCK_KAFKA: "false"
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: transactions_stream
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: fraud
      MODEL_PATH: /models/model.joblib
      SIMULATOR_URL: http://producer:8001
    volumes:
      - ./ml/artifacts:/models:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ---------- Dashboard Streamlit ----------
  frontend:
    build: ./frontend
    container_name: fraud-dashboard
    depends_on:
      - api
    mem_limit: 384m
    environment:
      API_URL: http://localhost:8000
      INTERNAL_API_URL: http://api:8000
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  kafka_data:
  mongo_data:
  spark_checkpoint:
  spark_ivy:
